# SPDX-License-Identifier: MIT
---
- name: Configure base operating system
  hosts: all
  roles:
    - role: common
      tags: ["common"]
    - role: networkd
      tags: ["network"]
    - role: nftables
      tags: ["nftables"]
    - role: wireguard
      tags: ["wireguard"]
    - role: sshd
      tags: ["sshd"]
    - role: sssd
      tags: ["sssd"]
  post_tasks:
    - name: Disable remote access to debian
      ansible.builtin.file:
        path: /home/debian/.ssh/authorized_keys
        state: absent
