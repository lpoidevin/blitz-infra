# SPDX-License-Identifier: MIT
---
- name: Deploy monitoring agents
  hosts: all
  roles:
    - role: prometheus_node_exporter
      tags: ["node_exporter"]
    - role: fluentbit
      tags: ["fluentbit"]

- name: Deploy monitoring backend
  hosts: core.*
  gather_facts: false
  roles:
    - role: prometheus
      tags: ["prometheus"]
    - role: loki
      tags: ["loki"]
    - role: grafana
      tags: ["grafana"]
    # - role: alertmanager
    #   tags: ["alertmanager"]

- name: Setup reverse proxy
  hosts: core.*
  gather_facts: false
  roles:
    - role: nginx_proxy
      tags: ["nginx", "proxy"]
