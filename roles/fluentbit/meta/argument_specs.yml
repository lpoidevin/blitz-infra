# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Deploy and configure fluent-bit agent
    options:
      fluentbit_loki_endpoint:
        type: str
        required: true
        description: Target hostname or IP for Loki push endpoint.

      fluentbit_nginx_logs_enabled:
        type: bool
        default: false
        description: Enable the collection of nginx logs.
