# SPDX-License-Identifier: MIT
argument_specs:
  main:
    short_description: Configure and harden SSH daemon using global settings and drop-in Match blocks
    options:
      sshd_global_config:
        type: dict
        default: {}
        description: >
          A dictionary of global SSH configuration directives to override or add to base defaults.
      sshd_match_blocks:
        type: list
        elements: dict
        default: []
        description: >
          A list of conditional Match blocks to deploy as a drop-in file
          in /etc/ssh/sshd_config.d/99-match-blocks.conf.
        options:
          condition:
            type: str
            required: true
            description: The Match criteria (e.g., 'Group sftpusers', 'User foo', 'Address 192.168.1.*').
          rules:
            type: dict
            required: true
            description: >
              Dictionary of SSH configuration directives to apply when the condition is met
              (e.g., { ChrootDirectory: "/sftp/%u", ForceCommand: "internal-sftp" }).
      sshd_firewall_chain:
        type: str
        default: "filter-input-v6"
        description: >
          The nftables firewall chain folder name inside /etc/nftables.d/ where the firewall rule should be placed.
          Set to 'filter-input' to allow IPv4 alongside IPv6.
