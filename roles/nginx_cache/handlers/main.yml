# SPDX-License-Identifier: MIT
---
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
