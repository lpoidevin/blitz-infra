---
# alloy_prometheus_endpoint: "prometheus.example.com"
# alloy_loki_endpoint: "loki.example.com"
alloy_listen_address: "[::1]:12345"

alloy_enable_node_exporter: true
alloy_node_exporter_scrape_interval: "15s"
alloy_node_exporter_disable_collectors:
  - bcache
  - btrfs
  - fibrechannel
  - infiniband
  - ipvs
  - nfs
  - nfsd
  - xfs
  - zfs
alloy_node_exporter_enable_collectors:
  - systemd

alloy_enable_hardware_exporter: "{{ ansible_facts['virtualization_role'] | default('') == 'host' }}"
alloy_hardware_targets: {}
#   - address: "localhost:9633"
#     job: "smartctl"
