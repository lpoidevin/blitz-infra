---
- name: Add Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
    state: present

- name: Install Alloy package
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Remove default Alloy config
  ansible.builtin.file:
    path: /etc/alloy/config.alloy
    state: absent

- name: Configure Alloy default service environment
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^CONFIG_FILE=', line: 'CONFIG_FILE="/etc/alloy"' }
    - { regexp: '^CUSTOM_ARGS=', line: 'CUSTOM_ARGS="--server.http.listen-addr={{ alloy_listen_address }}"' }
  loop_control:
    label: "{{ item.regexp }}"
  notify: Restart alloy

- name: Deploy base and system Alloy configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/alloy/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "00-base.alloy.j2", dest: "00-base.alloy" }
    - { src: "10-node.alloy.j2", dest: "10-node.alloy" }
    - { src: "20-services.alloy.j2", dest: "20-services.alloy" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload alloy

- name: Ensure Alloy service is enabled and running
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    state: started
