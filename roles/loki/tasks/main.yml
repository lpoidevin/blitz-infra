---
- name: Add Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
    state: present

- name: Install Loki package
  ansible.builtin.apt:
    name: loki
    state: present
    update_cache: true

- name: Ensure Loki data directory exists
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: loki
    group: root
    mode: "0755"

- name: Deploy Loki main configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/loki/config.yml
    mode: "0644"
  notify: Restart loki

- name: Deploy nftables firewall rule for Loki
  ansible.builtin.copy:
    content: |
      tcp dport 3100 accept \
      comment "Accept loki access"
    dest: /etc/nftables.d/filter-input-wg/loki.nft
    mode: "0644"
  notify: Reload nftables
