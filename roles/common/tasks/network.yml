---
- name: Ensure network packages are installed
  ansible.builtin.apt:
    name:
      - systemd-resolved
      - systemd-timesyncd
    state: present

- name: Disable unused defaults in systemd-resolved
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?{{ item.key }}\b'
    line: "{{ item.key }}={{ item.value }}"
    firstmatch: true
    state: present
  loop:
    - { key: LLMNR, value: "false" }
  notify: Reload systemd-resolved

- name: Deploy systemd-networkd interface configurations
  ansible.builtin.template:
    src: interface.network.j2
    dest: /etc/systemd/network/{{ item.name }}.network
    mode: "0644"
  loop: "{{ common_network_interfaces }}"
  when: common_network_interfaces | length > 0
  notify: Restart systemd-networkd

- name: Ensure systemd-networkd is enabled
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Disable networking service if present then reboot
  when:
    - "'networking.service' in ansible_facts['services']"
    - "ansible_facts['services']['networking.service']['status'] != 'not-found'"
  block:
    - name: Disable networking service
      ansible.builtin.systemd_service:
        name: networking.service
        enabled: false
    - name: Reboot
      ansible.builtin.reboot:

- name: Remove other network management tools
  ansible.builtin.apt:
    name:
      - netplan.io
      - ifupdown
    state: absent
    purge: true
    autoremove: true
  notify: Reboot
