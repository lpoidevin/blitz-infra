---
# Global
prometheus_global_scrape_interval: 15s
prometheus_global_evaluation_interval: 15s
prometheus_global_scrape_timeout: 10s

# Data retention
prometheus_retention_time: "4w"
prometheus_retention_size: "0"

# HTTP auth password files
prometheus_auth_pass_files: []

# Monitored services
prometheus_monitored_services: []
