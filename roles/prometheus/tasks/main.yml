---
- name: Install Prometheus package
  ansible.builtin.apt:
    name: prometheus
    state: present

- name: Remove standalone prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: absent
    purge: true
    autoremove: true

# - name: Create Prometheus rules directory
#   ansible.builtin.file:
#     path: "{{ prometheus_rule_files_path }}"
#     state: directory
#     owner: prometheus
#     group: prometheus
#     mode: "0755"

- name: Deploy Prometheus environment defaults
  ansible.builtin.template:
    src: prometheus.env.j2
    dest: /etc/default/prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Deploy Prometheus main configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    # owner: root
    # group: prometheus
    # mode: "0640"
    mode: "0644"
  notify: Reload prometheus

- name: Deploy nftables firewall rule for Prometheus
  ansible.builtin.copy:
    content: |
      tcp dport 9090 accept \
      comment "Accept prometheus access"
    dest: /etc/nftables.d/filter-input-wg/prometheus.nft
    mode: "0644"
  notify: Reload nftables
