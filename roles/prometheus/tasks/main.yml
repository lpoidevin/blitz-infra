---
- name: Install Prometheus package
  ansible.builtin.apt:
    name: prometheus
    state: present

- name: Deploy Prometheus environment defaults
  ansible.builtin.template:
    src: prometheus.env.j2
    dest: /etc/default/prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
  notify: Reload prometheus

- name: Create direcotory for HTTP auth password files
  ansible.builtin.file:
    path: /etc/prometheus/auth
    mode: "755"
    state: directory

- name: Deploy HTTP auth password files
  ansible.builtin.copy:
    content: "{{ item.password }}"
    dest: "/etc/prometheus/{{ item.path }}"
    owner: root
    group: prometheus
    mode: "0640"
  no_log: true
  notify: Reload prometheus
  loop: "{{ prometheus_auth_pass_files }}"
