---
- name: Setup game server
  ansible.builtin.import_tasks: install.yml

- name: Deploy public SSH key for SFTP access
  ansible.posix.authorized_key:
    user: "{{ cfx_server_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ cfx_server_sftp_keys }}"

- name: Deploy alloy configuration
  ansible.builtin.template:
    src: 70-cfx-server.alloy.j2
    dest: /etc/alloy.d/70-cfx-server.alloy
    mode: '0644'
  notify: Reload alloy

- name: Deploy firewall rules
  ansible.builtin.copy:
    content: |
      tcp dport 30120 accept \
      comment "Accept cfx server traffic"
      udp dport 30120 accept \
      comment "Accept cfx server traffic"
    dest: /etc/nftables.d/filter-input/cfx-server.nft
    mode: '0644'
  notify: Reload nftables

- name: Deploy firewall rules
  ansible.builtin.copy:
    content: |
      tcp dport 30120 accept \
      comment "Accept cfx server traffic"
    dest: /etc/nftables.d/filter-input-wg/cfx-server.nft
    mode: '0644'
  notify: Reload nftables
