---
- name: Check if encrypted credential exists
  ansible.builtin.stat:
    path: /etc/credstore.encrypted/network.wireguard.private.wg0
  register: wireguard_cred_file

- name: Generate and encrypt private key
  when: not wireguard_cred_file.stat.exists
  block:
    - name: Generate private key
      ansible.builtin.command: wg genkey
      register: wireguard_private_key
      no_log: true
      changed_when: true

    - name: Encrypt private key with systemd-creds
      community.general.systemd_creds_encrypt:
        secret: "{{ wireguard_private_key.stdout }}"
      register: wireguard_encrypted_wg_key

    - name: Save encrypted credential
      ansible.builtin.copy:
        content: "{{ wireguard_encrypted_wg_key.value }}"
        dest: /etc/credstore.encrypted/network.wireguard.private.wg0
        owner: root
        group: systemd-network
        mode: "0640"
      notify: Restart systemd-networkd

- name: Deploy network configuration
  ansible.builtin.template:
    src: "{{ item.file }}.j2"
    dest: "/etc/systemd/network/{{ item.file }}"
    owner: root
    group: systemd-network
    mode: "{{ item.mode }}"
  loop:
    - { file: wg0.netdev, mode: "0640" }
    - { file: wg0.network, mode: "0644" }
  notify: Restart systemd-networkd
