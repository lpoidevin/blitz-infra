---
lego_certificates:
  fxserver:
    challenge: ovh-dns
    account: blitz-security
    domains:
      - "{{ cfx_server_connect_endpoint }}"
      - "{{ cfx_server_txadmin_endpoint }}"

lego_deploy_targets:
  - name: fxserver
    service_cmd: /usr/bin/systemctl reload nginx
