# SPDX-License-Identifier: MIT
---
# Modules
nginx_cache_vts_module: true

# Trust proxy headers from wireguard network
nginx_cache_trusted_proxies: fd1e:39e:c6a4:face::/64

# Per-tenant vhost setup
nginx_cache_tenants:
  - name: blitz_legacy
    enabled: true
    domain: cache.legacy.coursepoursuite.fr
    backend_host: "[2001:41d0:c:67:1::dead]"
    tls_cert_path: /var/lib/lego/certificates/blitz_legacy.crt
    tls_key_path: /var/lib/lego/certificates/blitz_legacy.key

# Honeypot configuration
fail2ban_honeypot_logpath: /var/log/nginx/cache.legacy.coursepoursuite.fr.access.log
