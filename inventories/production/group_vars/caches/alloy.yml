---
# Data-Driven Service Definitions
alloy_monitored_services:
  nginx:
    enabled: true
    type: "prometheus_scrape"
    address: "localhost:9113"
    scrape_interval: "15s"
    relabel_hostname: true
    log_files:
      - path: "/var/log/nginx/access.log"
        job: "nginx_access"
      - path: "/var/log/nginx/error.log"
        job: "nginx_error"
