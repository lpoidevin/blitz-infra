---
# OVH network
dns_servers:
  - 213.186.33.99
  - 2001:41d0:3:163::1
ntp_servers:
  - ntp0.ovh.net

# Timezone
common_timezone: Europe/Paris

# Use IPv6 of the first interface as Wireguard peering address
wireguard_public_ipv6: "{{ common_network_interfaces[0]['ipv6_address'] | ansible.utils.ipv6('address') }}"
