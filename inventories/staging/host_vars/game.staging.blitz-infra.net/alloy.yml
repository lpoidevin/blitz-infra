---
# Data-Driven Service Definitions
alloy_monitored_services:
  incus:
    enabled: true
    type: "prometheus_scrape"
    address: "jupiter.example.com:9101"
    metrics_path: "/1.0/metrics"
    scheme: "https"
    scrape_interval: "15s"
    tls_config:
      ca_file: "/etc/alloy/tls/jupiter.crt"
      cert_file: "/etc/alloy/tls/metrics.crt"
      key_file: "/etc/alloy/tls/metrics.key"
      server_name: "jupiter"
      # insecure_skip_verify: false

  cfx_server:
    enabled: true
    type: "prometheus_scrape"
    # address: "localhost:30120"
    metrics_path: "/perf"
    scrape_interval: "15s"
    basic_auth:
      username: "cfx_user"
      password: "secretpassword"  # or use password_file: "/etc/alloy/cfx.pass"
    targets:
      - address: "cfx-server-1.example.com:30120"
        instance: "cfx-us-east"
      - address: "cfx-server-2.example.com:30120"
        instance: "cfx-eu-west"

