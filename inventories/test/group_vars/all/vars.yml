# SPDX-License-Identifier: MIT
---
# Global variables
domain: test.blitz-infra.net
base_dn: dc=test,dc=blitz-infra,dc=net

# Email reporting
common_upgrades_email: "root@{{ domain }}"
common_sudoers_email: "security@{{ domain }}"
fail2ban_destemail: "security@{{ domain }}"

# Monitoring
fluentbit_loki_endpoint: loki.test.blitz-infra.net

# SSH
sshd_global_config:
  AddressFamily: any
  PermitRootLogin: prohibit-password
  PasswordAuthentication: "yes"

sshd_firewall_chain: "filter-input"
