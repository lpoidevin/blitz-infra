# SPDX-License-Identifier: MIT
---
# Modules
nginx_cache_vts_module: true

# Trust proxy headers from wireguard network
nginx_cache_trusted_proxies: fd1e:39e:c6a4:1ee7::/64

# Per-tenant vhost setup
nginx_cache_tenants:
  - name: blitz_dev
    enabled: true
    domain: files.dev.coursepoursuite.fr
    backend_host: "[2001:41d0:c:67:1::cafe]"
    tls_cert_path: /var/lib/lego/certificates/blitz_dev.crt
    tls_key_path: /var/lib/lego/certificates/blitz_dev.key

# Logs centralization
fluentbit_nginx_logs_enabled: true

# Honeypot configuration
fail2ban_honeypot_logpath: /var/log/nginx/files.dev.coursepoursuite.fr.access.log
